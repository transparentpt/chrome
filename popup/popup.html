<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root { --tc-accent: #3a5bd0; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 300px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #1a1d24;
      background: #fff;
    }
    .head {
      background: var(--tc-accent);
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .head img { height: 22px; width: auto; display: block; }
    .head .name { color: #fff; font-weight: 600; font-size: 15px; }
    .body { padding: 14px 16px; font-size: 13px; line-height: 1.5; color: #374151; }
    .body p { margin-bottom: 10px; }
    .sites { font-size: 12px; color: #6b7280; margin-bottom: 12px; }
    .sites b { color: #374151; }
    a.cta {
      display: inline-block;
      background: var(--tc-accent);
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      font-size: 13px;
      padding: 8px 14px;
      border-radius: 8px;
    }
    .foot { font-size: 11px; color: #9aa1ac; padding: 0 16px 14px; }
  </style>
</head>
<body>
  <div class="head">
    <img src="../assets/wordmark.png" alt="TransparentCars">
  </div>
  <div class="body">
    <p>
      Em anúncios de carros usados em Portugal, este painel mostra uma
      <b>estimativa de preço justo</b>, o <b>custo anual de circulação (IUC)</b>
      e uma <b>checklist do comprador</b> — direto na página.
    </p>
    <div class="sites">Funciona em <b>StandVirtual</b>, <b>OLX</b> e <b>CustoJusto</b>.</div>
    <a class="cta" href="https://transparent.pt" target="_blank" rel="noopener noreferrer">Abrir TransparentCars</a>
  </div>
  <div class="foot">Feito para o mercado local português.</div>
</body>
</html>
